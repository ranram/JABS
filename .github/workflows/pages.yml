name: Publish JABS website

# Run manually after enabling GitHub Pages in repository settings.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Exclude local maintenance instructions
        run: rm -f site/README.md
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
