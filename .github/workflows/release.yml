name: Build JABS release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag matching the committed application version
        required: true
        default: v1.2.0
  push:
    tags:
      - "v*"

concurrency:
  group: jabs-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Validate release version and updater signing setup
        env:
          JABS_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          JABS_UPDATER_PUBLIC_KEY: ${{ vars.JABS_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/check-release-config.mjs --signed

      - name: Validate the Rust lockfile before Cargo can execute build scripts
        run: pnpm run rust-lock:check

      - name: Check generated files and TypeScript
        run: pnpm run typecheck

      - name: Run focused renderer tests
        run: pnpm test

      - name: Check the native core using the exact Cargo lockfile
        run: pnpm run check:rust

  release:
    name: Build ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: ubuntu-22.04
            args: --bundles deb,appimage
            rust_targets: ""
          - name: Windows x64
            platform: windows-latest
            args: --bundles nsis
            rust_targets: ""
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --bundles app,dmg --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            args: --bundles app,dmg --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.rust_targets }}

      - name: Install Linux native dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Validate the Rust lockfile before Cargo can execute build scripts
        run: pnpm run rust-lock:check

      - name: Configure the updater public key for packaging
        env:
          JABS_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          JABS_UPDATER_PUBLIC_KEY: ${{ vars.JABS_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/check-release-config.mjs --prepare-updater

      - name: Build packages and create a draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos') && '-' || '' }}
          JABS_UPDATER_PUBLIC_KEY: ${{ vars.JABS_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          releaseName: JABS ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          releaseBody: |
            JABS packages with signed updater artifacts, built from ${{ github.sha }}.

            Updater signatures verify downloads; these packages do not have platform code-signing certificates.

            Review and test every native package before publishing this draft.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          # Everything after `--` is forwarded by the Tauri CLI to Cargo.
          args: ${{ matrix.args }} -- --locked
