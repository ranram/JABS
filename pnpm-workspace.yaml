packages:
  - "."

# Supply-chain policy applies to the public desktop project.
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true
# Install the reviewed security patch without waiting for the release-age window.
minimumReleaseAgeExclude:
  - "vitest@4.1.12"
  - "@vitest/expect@4.1.12"
  - "@vitest/mocker@4.1.12"
  - "@vitest/pretty-format@4.1.12"
  - "@vitest/runner@4.1.12"
  - "@vitest/snapshot@4.1.12"
  - "@vitest/spy@4.1.12"
  - "@vitest/utils@4.1.12"
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600
trustLockfile: false
blockExoticSubdeps: true

# Narrow security backport for an advisory in the active dependency graph.
overrides:
  "nanoid@^3": "3.3.19"
  "source-map-js@^1": "1.2.2"

# Fail instead of silently installing or running with an unexpected dependency tree.
engineStrict: true
verifyDepsBeforeRun: error
verifyStoreIntegrity: true
strictStorePkgContentCheck: true
strictDepBuilds: true
saveExact: true

# Exact versions are intentional: dependency install scripts require re-review on update.
allowBuilds:
  esbuild@0.25.12: true
  fsevents@2.3.3: true
