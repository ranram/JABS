[package]
name = "jabs"
version = "1.1.1"
description = "JABS — Just Another Bracketing System, a local-first fighting game bracket and OBS score manager."
authors = ["JABS contributors"]
license = "Apache-2.0"
repository = ""
edition = "2024"
rust-version = "1.97"

[lib]
name = "jabs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
jabs-startgg-client = { path = "../crates/jabs-startgg-client" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.4", features = [] }
time = { version = "=0.3.51", default-features = false, features = ["formatting", "parsing", "std"] }
tokio = { version = "=1.53.1", features = ["net", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "=0.6.11", default-features = false, features = ["cors"] }
unicode-normalization = { version = "=0.1.25", default-features = false, features = ["std"] }
zeroize = { version = "=1.9.0", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=4.1.6", default-features = false, features = ["v1", "zbus-secret-service-keyring-store"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=4.1.6", default-features = false, features = ["v1", "apple-native-keyring-store"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=4.1.6", default-features = false, features = ["v1", "windows-native-keyring-store"] }

# Keep ordinary contributor builds lean; runtime diagnostics do not depend on debug symbols.
[profile.dev]
debug = 0

[profile.test]
debug = 0

# Installer builds should contain optimized application code, not native build/debug weight.
[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
