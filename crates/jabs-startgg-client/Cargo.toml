[package]
name = "jabs-startgg-client"
version = "1.1.1"
description = "Shared native start.gg GraphQL transport for JABS"
authors = ["JABS contributors"]
license = "Apache-2.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["sync", "time"] }
